# App Runner: runtime は python311（python3 は古い 3.8 系に紐づくことがあり、非対応エラーになる）
# run.runtime-version は省略可。トップレベル runtime と二重指定すると検証エラーになることがある。
version: 1.0
runtime: python311

build:
  commands:
    build:
      - python3 --version

run:
  pre-run:
    - python3 -m pip install --no-cache-dir -r requirements.txt
  command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
  network:
    port: 8000
