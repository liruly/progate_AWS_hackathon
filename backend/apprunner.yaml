# App Runner Python 3.11（ソースディレクトリ: backend）
# - デプロイ失敗（ビルド成功後）: $PORT 不一致や CWD ずれでヘルスチェック落ちしやすい → 8000 固定 + /app/backend で実行
version: 1.0
runtime: python311

build:
  commands:
    build:
      - python3 --version

run:
  pre-run:
    - sh -c "cd /app/backend && python3 -m pip install --no-cache-dir -r requirements.txt"
  command: sh -c "cd /app/backend && exec python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
  network:
    port: 8000
